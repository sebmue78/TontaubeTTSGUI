name: Android-App bauen

on:
  push:
    branches: [main, macos-app, "claude/**"]
    paths: ["android/**", ".github/workflows/android-app.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android-app.yml"]
  workflow_dispatch:
  workflow_call:  # von release.yml für versionierte Releases
    inputs:
      ref:
        description: Commit, der gebaut wird (leer = auslösender Commit)
        type: string
        default: ""
      release:
        description: Release-Build ohne Entwicklungs-Zusatz an der Versionsnummer
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Version bestimmen
        working-directory: .
        run: |
          # Entwicklungs-Builds bekommen einen Zusatz, z. B. 0.2.0-dev.42
          if [ "${{ inputs.release }}" != "true" ]; then echo "BUILD_SUFFIX=-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests (Import, Abschnitte, Streaming-Parser, App-Logik)
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest

      - name: APK bauen
        run: ./gradlew --no-daemon :app:assembleRelease :app:lintRelease

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk Tontaube-Vorlesen.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Tontaube-Vorlesen-apk
          path: android/Tontaube-Vorlesen.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-berichte
          path: |
            android/app/build/reports/
            android/core/build/reports/
          if-no-files-found: ignore

  e2e:
    # Ende-zu-Ende-Test im Emulator gegen den Mock-Server: importieren, streamen, pausieren, fortsetzen
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mock-Server starten
        run: |
          pip install -q -r requirements-dev.txt
          TTS_API_KEY=testkey nohup python tools/mock_server.py > mock.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/readyz && break; sleep 1; done

      - name: Emulator-Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: ./android/e2e.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-ergebnisse
          path: |
            android/e2e-screens/
            android/instrument.txt
            android/e2e-logcat.txt
            mock.log
          if-no-files-found: ignore
