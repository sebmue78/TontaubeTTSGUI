name: Android-App bauen

on:
  push:
    branches: [main, macos-app, "claude/**"]
    paths: ["android/**", ".github/workflows/android-app.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android-app.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests (Import, Abschnitte, Streaming-Parser, App-Logik)
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest

      - name: APK bauen
        run: ./gradlew --no-daemon :app:assembleRelease :app:lintRelease

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk Tontaube-Vorlesen.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tontaube-Vorlesen-apk
          path: |
            android/Tontaube-Vorlesen.apk
            android/app/build/reports/
            android/core/build/reports/
          if-no-files-found: ignore

      - name: Als Release "android-latest" veröffentlichen
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=android-latest
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" Tontaube-Vorlesen.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Tontaube Vorlesen für Android – aktueller Stand" \
            --notes "Automatisch gebaut aus ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). APK auf dem Handy öffnen und installieren (einmalig „Installation aus unbekannten Quellen“ erlauben). Ab Android 8."
