name: Android-App bauen

on:
  push:
    branches: [main, macos-app, "claude/**"]
    paths: ["android/**", ".github/workflows/android-app.yml", "tontaube_gui/server_assets/model_gateway.py", "tools/mock_server.py"]
  pull_request:
    paths: ["android/**", ".github/workflows/android-app.yml", "tontaube_gui/server_assets/model_gateway.py", "tools/mock_server.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests (Import, Abschnitte, Streaming-Parser, App-Logik)
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest

      - name: APK bauen
        run: ./gradlew --no-daemon :app:assembleRelease :app:lintRelease

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk Tontaube-Vorlesen.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tontaube-Vorlesen-apk
          path: |
            android/Tontaube-Vorlesen.apk
            android/app/build/reports/
            android/core/build/reports/
          if-no-files-found: ignore

      - name: Als Release "android-latest" veröffentlichen
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=android-latest
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" Tontaube-Vorlesen.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Tontaube Vorlesen für Android – aktueller Stand" \
            --notes "Automatisch gebaut aus ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). APK auf dem Handy öffnen und installieren (einmalig „Installation aus unbekannten Quellen“ erlauben). Ab Android 8."

  e2e:
    # Ende-zu-Ende-Test im Emulator gegen den Mock-Server: importieren, streamen, pausieren, fortsetzen
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mock-Server und Modell-Gateway (Testmodus) starten
        run: |
          pip install -q -r requirements-dev.txt
          # Tontaube-Mock intern auf 8090, davor das Gateway mit API-Key auf 8080 (wie in der Desktop-App)
          TTS_PORT=8090 nohup python tools/mock_server.py > mock.log 2>&1 &
          GATEWAY_HOST=0.0.0.0 GATEWAY_PORT=8080 GATEWAY_UPSTREAM=http://127.0.0.1:8090 GATEWAY_FAKE_ENGINES=1 \
            REQUIRE_API_KEY=1 TTS_API_KEY=testkey nohup python tontaube_gui/server_assets/model_gateway.py > gateway.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/readyz && break; sleep 1; done
          curl -sf -H "x-api-key: testkey" http://127.0.0.1:8080/models

      - name: Emulator-Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: ./android/e2e.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-ergebnisse
          path: |
            android/e2e-screens/
            android/instrument.txt
            android/e2e-logcat.txt
            mock.log
            gateway.log
          if-no-files-found: ignore
