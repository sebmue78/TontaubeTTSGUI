name: macOS-App bauen

on:
  push:
    branches: [main, macos-app]
    paths-ignore: ["**.md", "docs/**", "android/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "android/**"]
  workflow_dispatch:
  workflow_call:  # von release.yml für versionierte Releases
    inputs:
      ref:
        description: Commit, der gebaut wird (leer = auslösender Commit)
        type: string
        default: ""
      release:
        description: Release-Build ohne Entwicklungs-Zusatz an der Versionsnummer
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest  # Apple Silicon (arm64)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Version bestimmen
        run: |
          # Entwicklungs-Builds bekommen einen Zusatz, z. B. 0.2.0-dev.42
          if [ "${{ inputs.release }}" != "true" ]; then echo "BUILD_SUFFIX=-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"; fi
          echo "Version: $(cat VERSION)$( [ "${{ inputs.release }}" = "true" ] || echo "-dev.${GITHUB_RUN_NUMBER}")"

      - uses: astral-sh/setup-uv@v6

      - name: Tests (Client gegen Mock-Server)
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -r requirements-dev.txt
          .venv/bin/python -m pytest -q

      - name: App und DMG bauen
        run: ./macos/build_app.sh --dmg

      - name: Rauchtest – App starten, Oberfläche muss antworten
        run: |
          APP="dist/Tontaube TTS.app/Contents/MacOS/TontaubeTTS"
          # launcher.sh schreibt sein Log nach ~/Library/Application Support/TontaubeTTS/logs
          "$APP" &
          for i in $(seq 1 120); do
            if curl -sf -o /dev/null http://127.0.0.1:7860/; then echo "Oberfläche läuft nach ${i}s"; break; fi
            sleep 2
          done
          curl -sf -o /dev/null http://127.0.0.1:7860/ || { cat "$HOME/Library/Application Support/TontaubeTTS/logs/app.log"; exit 1; }
          sleep 20
          echo "--- Launcher-Protokoll ---"
          cat "$HOME/Library/Application Support/TontaubeTTS/logs/launcher.log" 2>/dev/null | tail -20 || true
          pkill -f "tontaube_gui --managed" || true

      - uses: actions/upload-artifact@v4
        with:
          name: Tontaube-TTS-dmg
          path: dist/Tontaube-TTS.dmg
